```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irpair Auto-Reply Assistant</title>
    <!-- Tailwind CSS for modern responsive utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container {
            background-image: radial-gradient(#111b21 15%, transparent 16%);
            background-size: 20px 20px;
            background-color: #0b141a;
        }
        /* Custom scrollbar for chat history */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="bg-[#005c4b] px-4 py-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-11 h-11 rounded-full bg-[#202c33] flex items-center justify-center font-bold text-[#00a884] text-lg shadow">IP</div>
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#005c4b] rounded-full"></span>
            </div>
            <div>
                <h2 class="text-white font-semibold text-base leading-tight">Irpair Auto-Reply</h2>
                <p class="text-xs text-[#8696a0] mt-0.5">متصل الآن • الرد الآلي بأسلوب هشام</p>
            </div>
        </div>
        <div class="flex items-center gap-4 text-emerald-100 text-sm">
            <span class="hidden sm:inline bg-[#004d40] px-3 py-1 rounded-full text-xs border border-[#00695c]">مركز صيانة الهواتف</span>
        </div>
    </header>

    <!-- Chat Message History Container -->
    <div id="chat-container" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
        <div class="message bot bg-[#005c4b] text-white max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow relative self-end">
            أهلاً بيك يا غالي مع Irpair للصيانة. ابعت لي موديل الجهاز أو العطل وهرد عليك بالصح فوراً.
            <div class="text-[10px] text-emerald-200 mt-1 text-left flex items-center justify-end gap-1">
                <span class="time-stamp">الان</span>
                <span>✓✓</span>
            </div>
        </div>
    </div>

    <!-- Quick Prompt Suggestions Bar -->
    <div class="bg-[#111b21] px-4 py-2 border-t border-[#222d34] flex gap-2 overflow-x-auto whitespace-nowrap">
        <button onclick="sendQuickPrompt('فين مكان المحل؟')" class="bg-[#202c33] hover:bg-[#2a3942] text-xs text-emerald-400 px-3 py-1.5 rounded-full border border-[#2a3942] transition">📍 العنوان والمكان</button>
        <button onclick="sendQuickPrompt('عندي شاشة مكسورة')" class="bg-[#202c33] hover:bg-[#2a3942] text-xs text-emerald-400 px-3 py-1.5 rounded-full border border-[#2a3942] transition">📱 تغيير شاشة</button>
        <button onclick="sendQuickPrompt('الموبايل فاصل ومش بيفتح')" class="bg-[#202c33] hover:bg-[#2a3942] text-xs text-emerald-400 px-3 py-1.5 rounded-full border border-[#2a3942] transition">⚡ عطل باور وشحن</button>
        <button onclick="sendQuickPrompt('كام تكلفة الإصلاح؟')" class="bg-[#202c33] hover:bg-[#2a3942] text-xs text-emerald-400 px-3 py-1.5 rounded-full border border-[#2a3942] transition">💰 الاستفسار عن الأسعار</button>
    </div>

    <!-- Input Bar Section -->
    <div class="bg-[#202c33] p-3 flex items-center gap-3 shadow-lg">
        <input type="text" id="user-input" placeholder="اكتب رسالة العميل أو موديل الجهاز هنا..." onkeypress="handleKeyPress(event)" class="flex-1 bg-[#2a3942] border-none px-4 py-3 rounded-xl text-white text-sm outline-none placeholder-[#8696a0] focus:ring-1 focus:ring-[#00a884]">
        <button onclick="sendMessage()" class="bg-[#00a884] hover:bg-[#01755f] text-white w-12 h-12 rounded-xl flex items-center justify-center transition shadow-md active:scale-95">
            <svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
    </div>

    <script>
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            
            if (sender === 'client') {
                msgDiv.className = 'message client bg-[#202c33] text-[#e9edef] max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl rounded-tl-none text-sm leading-relaxed shadow relative self-start';
                msgDiv.innerHTML = `
                    ${escapeHtml(text)}
                    <div class="text-[10px] text-[#8696a0] mt-1 text-left">${getCurrentTime()}</div>
                `;
            } else {
                msgDiv.className = 'message bot bg-[#005c4b] text-white max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow relative self-end';
                msgDiv.innerHTML = `
                    ${escapeHtml(text)}
                    <div class="text-[10px] text-emerald-200 mt-1 text-left flex items-center justify-end gap-1">
                        <span>${getCurrentTime()}</span>
                        <span>✓✓</span>
                    </div>
                `;
            }
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(>"/g, "&gt;");
        }

        function getIrpairResponse(message) {
            const msg = message.toLowerCase();
            
            if (msg.includes('مكان') || msg.includes('فين') || msg.includes('عنوان') || msg.includes('المحل')) {
                return "منور يا غالي. المحل في شارع التلاتيني قدام البوابة الخلفية للساحة، اسأل على Irpair وهتلاقيني في الخدمة.";
            } else if (msg.includes('شاشة') || msg.includes('تكسرت') || msg.includes('تغيير') || msg.includes('تاتش')) {
                return "أهلاً بيك. الشاشات متوفرة أنواع مختلفة (أصلي، كوبي، نزع). ابعت لي موديل الجهاز بالظبط عشان أقول لك السعر والتكلفة كام.";
            } else if (msg.includes('باور') || msg.includes('فاصل') || msg.includes('شحن') || msg.includes('مفتحش') || msg.includes('مش بيفتح')) {
                return "تمام، ده غالباً عطل آيسي باور أو دايرة شحن. هات الجهاز المحل نفحصه بالمجهر ونظبطه لك بإذن الله.";
            } else if (msg.includes('سعر') || msg.includes('كام') || msg.includes('تكلفة')) {
                return "الأسعار بتختلف حسب نوع العطل وموديل الجهاز. ابعت لي تفاصيل الجهاز بالظبط وعينيا ليك.";
            } else {
                return "تحياتي ليك يا باشا. ابعت لي تفاصيل العطل أو موديل الجهاز بالتحديد عشان أفيدك بالصح.";
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'client');
            inputField.value = '';

            // Simulate typing delay for realistic bot behavior
            setTimeout(() => {
                const reply = getIrpairResponse(text);
                appendMessage(reply, 'bot');
            }, 600);
        }

        function sendQuickPrompt(promptText) {
            document.getElementById('user-input').value = promptText;
            sendMessage();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
